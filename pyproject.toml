[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-supply-chain-lab"
version = "0.1.0"
description = "Reproducible supply-chain simulation and local-agent evaluation laboratory"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["fastapi>=0.135,<0.142", "uvicorn[standard]>=0.41,<0.55", "pydantic>=2.12,<3", "sqlalchemy>=2.0.48,<2.2", "psycopg[binary]>=3.3,<4", "httpx>=0.28,<0.29", "python-multipart>=0.0.22,<0.1"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.15,<0.17", "pip-audit>=2.10,<3"]

[project.scripts]
supply-lab = "supply_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
